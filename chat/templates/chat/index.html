{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local RAG Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .chat-container { height: calc(100vh - 200px); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex h-screen overflow-hidden">

    <!-- Sidebar for Context -->
    <aside class="w-80 bg-white border-r border-gray-200 flex flex-col shadow-sm">
        <div class="p-4 border-b border-gray-200">
            <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                <i class="fas fa-robot text-blue-600"></i> Local RAG
            </h1>
            <p class="text-xs text-gray-500 mt-1">Powered by Qwen 2.5 1.5B</p>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4 space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Upload Documents & Images</label>
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-4 text-center hover:bg-gray-50 transition cursor-pointer" onclick="document.getElementById('file-input').click()">
                    <i class="fas fa-cloud-upload-alt text-2xl text-gray-400 mb-2"></i>
                    <p class="text-sm text-gray-500">Click to upload PDF, DOCX, TXT, Images</p>
                    <input type="file" id="file-input" class="hidden" multiple accept=".pdf,.docx,.doc,.txt,.png,.jpg,.jpeg,.html,.htm">
                </div>
                <div id="file-list" class="mt-2 text-xs text-gray-600 space-y-1"></div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Additional Context / Notes</label>
                <textarea id="text-context" rows="4" class="w-full p-2 border border-gray-300 rounded-md text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="Paste text context here..."></textarea>
            </div>
            
            <button onclick="uploadContext()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition flex items-center justify-center gap-2">
                <i class="fas fa-plus"></i> Add to Knowledge Base
            </button>
            
            <button onclick="clearContext()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2 px-4 rounded-md transition flex items-center justify-center gap-2">
                <i class="fas fa-trash-alt"></i> Clear Knowledge Base
            </button>
            
            <div id="status-message" class="text-xs text-green-600 bg-green-50 p-2 rounded hidden"></div>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col bg-gray-50">
        <header class="bg-white border-b border-gray-200 p-4 shadow-sm">
            <h2 class="text-lg font-semibold text-gray-800">Chat</h2>
            <p class="text-sm text-gray-500">Ask questions based on your uploaded context.</p>
        </header>

        <div id="chat-window" class="flex-1 overflow-y-auto p-6 space-y-4">
            <div class="flex justify-center text-sm text-gray-400 my-8">
                Start by adding some documents or context on the left, then ask a question below.
            </div>
        </div>

        <div class="bg-white border-t border-gray-200 p-4">
            <div class="max-w-3xl mx-auto flex gap-2">
                <input type="text" id="chat-input" class="flex-1 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ask a question about your documents..." onkeypress="if(event.key === 'Enter') sendQuery()">
                <button onclick="sendQuery()" id="send-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 rounded-lg transition flex items-center gap-2">
                    <i class="fas fa-paper-plane"></i> Send
                </button>
            </div>
        </div>
    </main>

    <script src="{% static 'chat/main.js' %}"></script>
</body>
</html>
